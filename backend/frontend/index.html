<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07c160">
<link rel="icon" id="appIcon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='64'%20height='64'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2307c160'/%3E%3Ctext%20x='32'%20y='43'%20text-anchor='middle'%20font-size='34'%20font-family='Microsoft%20YaHei,sans-serif'%20font-weight='700'%20fill='white'%3E%E5%BE%AE%3C/text%3E%3C/svg%3E">
<title>Qwent</title>
<link rel="stylesheet" href="style.css?v=73">
<link rel="stylesheet" href="qq.css?v=19">
</head>
<body>
<div class="app">
  <!-- 左侧功能栏 -->
  <nav class="rail" aria-label="主导航">
    <div class="avatar" id="brandLogo" role="button" tabindex="0"
         aria-label="Qwent" title="点击切换到 QQ">微</div>
    <button class="rail-btn active" data-view="chats" title="聊天" aria-label="聊天"><span class="rail-ico">💬</span></button>
    <button class="rail-btn" data-view="contacts" title="通讯录" aria-label="通讯录"><span class="rail-ico">👥</span></button>
    <button class="rail-btn" data-view="files" title="文件" aria-label="文件"><span class="rail-ico">📁</span></button>
    <button class="rail-btn" data-view="links" title="链接 / 公众号" aria-label="链接 / 公众号"><span class="rail-ico">📰</span></button>
    <button class="rail-btn" data-view="moments" title="朋友圈" aria-label="朋友圈"><span class="rail-ico">🌄</span></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" data-view="settings" title="设置" aria-label="设置"><span class="rail-ico">⚙️</span></button>
  </nav>

  <!-- 中栏列表 -->
  <section class="list-pane" aria-label="导航列表">
    <div class="searchbar">
      <label class="sr-only" for="searchInput">搜索会话或消息</label>
      <input id="searchInput" type="search" autocomplete="off" placeholder="搜索会话 / 全局搜消息（回车）">
    </div>
    <!-- QQ 模式「消息」页的视图切换：固定在列表上方，切到知识库记录后仍可切回 -->
    <div id="qqViewTabs" class="qq-view-tabs" style="display:none"></div>
    <div id="sessionList" class="session-list"></div>
    <div id="qqList" class="session-list" style="display:none"></div>
    <div id="resultList" class="session-list" style="display:none"></div>
    <div id="contactList" class="session-list" style="display:none"></div>
    <div id="fileList" class="session-list" style="display:none"></div>
    <div id="linkList" class="session-list" style="display:none"></div>
    <div id="snsList" class="session-list" style="display:none"></div>
    <div id="settingsNav" class="session-list" style="display:none"></div>
    <div id="aiSessionList" class="session-list" style="display:none"></div>

  </section>

  <!-- 右区：聊天列 + AI 结果列 -->
  <main class="chat-pane">
    <div id="chatEmpty" class="chat-empty">
      <div class="logo-big">微</div>
      <h2>Qwent</h2>
      <p class="qwent-sub">QQ · WeChat Agent — 两边的记录都能分开问</p>
      <p>选择一个会话浏览记录，或在置顶的 <b>✦ AI 助手</b> 里全局提问</p>
      <p class="hint" id="statusHint"></p>
    </div>

    <div id="chatMain" class="chat-main" style="display:none">
      <!-- 中间：聊天 / 预览 -->
      <div class="chat-column">
        <header class="chat-header">
          <div class="chat-title-row">
            <span id="backToChat" class="back-btn" style="display:none" title="返回聊天">←</span>
            <span id="chatTitle" class="chat-title"></span>
            <span id="chatMeta" class="chat-meta"></span>
          </div>
          <div class="chat-actions"></div>
        </header>
        <div class="chat-body">
          <div id="msgList" class="msg-list">
            <div id="loadMore" class="load-more" style="display:none">加载更早的消息…</div>
            <div id="msgs"></div>
          </div>
          <div id="previewPane" class="preview-pane" style="display:none">
            <div id="pvBody" class="pv-body"></div>
          </div>
        </div>
        <footer class="composer-wrap">
          <div id="quoteBar" class="quote-block" style="display:none">
            <div class="quote-chips" id="quoteList"></div>
            <span id="quoteClear" class="quote-dismiss" title="清空全部引用">✕</span>
          </div>
          <div class="composer-toolbar">
            <div id="scopeBar" class="scope-pill" style="display:none">
              <label class="scope-toggle" id="scopeToggleWrap"
                     title="勾选：只在当前会话/文件内检索提问；取消勾选：全局检索全部聊天记录">
                <input type="checkbox" id="scopeToggle" checked>
                <span id="scopeLabel">仅当前会话内提问</span>
              </label>
            </div>
            <div class="mode-segment slim-segment" role="radiogroup" aria-label="提问方式">
              <label title="快速问答：工具调用上限本会话 4 步、全局 6 步"><input type="radio" id="fastMode" name="chatAskMode" checked><span>快速问答</span></label>
              <label title="探索模式：工具调用上限本会话 8 步、全局 12 步"><input type="radio" id="exploreMode" name="chatAskMode"><span>探索模式</span></label>
            </div>
            <label class="tool-pill tool-pill-toggle" title="深度思考：切换推理模型，复杂问题更准但更慢"><input type="checkbox" id="thinkToggle"><span>深度思考</span></label>
            <span class="toolbar-spacer"></span>
            <input type="checkbox" id="exploreToggle" class="mode-state" aria-hidden="true" tabindex="-1">
          </div>
          <div class="composer">
            <div class="input-shell">
              <textarea id="input" rows="1" placeholder="输入想了解的问题…" title="Enter 发送 · Shift+Enter 换行；在消息上右键可加入引用"></textarea>
            </div>
            <div class="composer-actions">
              <button id="newSessionBtn" class="icon-btn" title="新建 AI 会话">＋</button>
              <button id="sendBtn">发送</button>
            </div>
          </div>
        </footer>
      </div>

      <!-- 右侧：只显示提问与 AI 结果 -->
      <button id="drawerFab" class="drawer-fab" style="display:none" title="显示 AI 问答">✦</button>
      <div id="settingsFull" class="settings-full" style="display:none">
        <div class="sf-nav" id="sfNav"></div>
        <div class="sf-body" id="sfBody"></div>
      </div>
      <aside id="assistantPane" class="assistant-pane" style="display:none">
        <div class="drawer-head assistant-head">
          <div class="assistant-heading"><span class="assistant-mark">✦</span><div><b id="assistantTitle">AI 助手</b><small>统一检索聊天记录，帮你归纳和追问</small></div></div>
          <span id="assistantMeta" class="drawer-scope"></span>
        </div>
        <div id="assistantConv" class="qa-list"></div>
        <footer class="composer-wrap assistant-composer-wrap">
          <div class="composer-toolbar">
            <div class="scope-pill assistant-scope-pill">
              <select id="assistantScopeSelect" class="assistant-scope-select" aria-label="选择回答范围">
                <option value="assistant:wechat">全部微信记录</option>
              </select>
              <label class="scope-toggle" id="assistantScopeWrap" title="勾选后只在这个范围内检索" style="display:none">
                <input type="checkbox" id="assistantScopeToggle" checked><span id="assistantScopeToggleText">仅本会话</span><b id="assistantScopeName"></b>
              </label>
            </div>
            <div class="mode-segment slim-segment" role="radiogroup" aria-label="AI 助手提问方式">
              <label title="快速问答"><input type="radio" id="assistantFastMode" name="assistantAskMode" checked><span>快速问答</span></label>
              <label title="探索模式"><input type="radio" id="assistantExploreMode" name="assistantAskMode"><span>探索模式</span></label>
            </div>
            <label class="tool-pill tool-pill-toggle" title="深度思考：切换推理模型"><input type="checkbox" id="assistantThink"><span>深度思考</span></label>
            <span class="toolbar-spacer"></span>
          </div>
          <div class="composer assistant-composer">
            <div class="input-shell">
              <textarea id="assistantInput" rows="1" placeholder="输入想了解的问题…" title="Enter 发送 · Shift+Enter 换行"></textarea>
            </div>
            <div class="composer-actions">
              <button id="assistantNew" class="icon-btn" title="新建 AI 会话">＋</button>
              <button id="assistantSend">发送</button>
            </div>
          </div>
        </footer>
      </aside>
      <aside id="aiSessionsPanel" class="ai-sessions-panel" style="display:none">
        <div class="drawer-head">
          <span>✦ AI 会话</span>
          <span class="drawer-scope">点一条在中间继续</span>
        </div>
        <div id="aiTreeInPanel" class="ai-tree"></div>
      </aside>
      <aside id="drawer" class="drawer">
        <div class="drawer-head">
          <span>✦ AI 问答结果</span>
          <span id="drawerScope" class="drawer-scope"></span>
        </div>
        <div id="qaList" class="qa-list"></div>
      </aside>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="platform.js?v=5"></script>
<script src="app.js?v=154"></script>
<script src="settings_bot.js?v=4"></script>
<script src="stream_qa.js?v=24"></script>
</body>
</html>
