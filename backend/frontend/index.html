<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07c160">
<title>微信知识助手</title>
<link rel="stylesheet" href="style.css?v=53">
</head>
<body>
<div class="app">
  <!-- 左侧功能栏 -->
  <nav class="rail" aria-label="主导航">
    <div class="avatar" aria-label="微信知识助手">微</div>
    <button class="rail-btn active" data-view="chats" title="聊天" aria-label="聊天">💬</button>
    <button class="rail-btn" data-view="contacts" title="通讯录" aria-label="通讯录">👥</button>
    <button class="rail-btn" data-view="files" title="文件" aria-label="文件">📁</button>
    <button class="rail-btn" data-view="links" title="链接 / 公众号" aria-label="链接 / 公众号">📰</button>
    <button class="rail-btn" data-view="moments" title="朋友圈" aria-label="朋友圈">🌄</button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" data-view="settings" title="设置" aria-label="设置">⚙️</button>
  </nav>

  <!-- 中栏列表 -->
  <section class="list-pane" aria-label="导航列表">
    <div class="searchbar">
      <label class="sr-only" for="searchInput">搜索会话或消息</label>
      <input id="searchInput" type="search" autocomplete="off" placeholder="搜索会话 / 全局搜消息（回车）">
    </div>
    <div id="sessionList" class="session-list"></div>
    <div id="resultList" class="session-list" style="display:none"></div>
    <div id="contactList" class="session-list" style="display:none"></div>
    <div id="fileList" class="session-list" style="display:none"></div>
    <div id="linkList" class="session-list" style="display:none"></div>
    <div id="snsList" class="session-list" style="display:none"></div>
    <div id="settingsNav" class="session-list" style="display:none"></div>
    <div id="aiSessionList" class="session-list" style="display:none"></div>

  </section>

  <!-- 右区：聊天列 + AI 结果列 -->
  <main class="chat-pane">
    <div id="chatEmpty" class="chat-empty">
      <div class="logo-big">微</div>
      <h2>微信知识助手</h2>
      <p>选择一个会话浏览记录，或在置顶的 <b>✦ AI 助手</b> 里全局提问</p>
      <p class="hint" id="statusHint"></p>
    </div>

    <div id="chatMain" class="chat-main" style="display:none">
      <!-- 中间：聊天 / 预览 -->
      <div class="chat-column">
        <header class="chat-header">
          <div class="chat-title-row">
            <span id="backToChat" class="back-btn" style="display:none" title="返回聊天">←</span>
            <span id="chatTitle" class="chat-title"></span>
            <span id="chatMeta" class="chat-meta"></span>
          </div>
          <div class="chat-actions"></div>
        </header>
        <div class="chat-body">
          <div id="msgList" class="msg-list">
            <div id="loadMore" class="load-more" style="display:none">加载更早的消息…</div>
            <div id="msgs"></div>
          </div>
          <div id="previewPane" class="preview-pane" style="display:none">
            <div id="pvBody" class="pv-body"></div>
          </div>
        </div>
        <footer class="composer-wrap">
          <div id="quoteBar" class="quote-bar" style="display:none">
            <div class="quote-bar-body">
              <div class="quote-bar-title">引用 <span id="quoteCount"></span></div>
              <div id="quoteList" class="quote-list"></div>
            </div>
            <span id="quoteClear" class="quote-clear" title="取消引用">✕</span>
          </div>
          <div id="scopeBar" class="scope-bar" style="display:none">
            <span class="scope-caption">范围</span>
            <label class="scope-toggle" id="scopeToggleWrap"
                   title="勾选：只在当前会话/文件内检索提问；取消勾选：全局检索全部聊天记录">
              <input type="checkbox" id="scopeToggle" checked>
              <span id="scopeLabel">仅在当前会话内提问</span>
            </label>
          </div>
          <div class="composer-toolbar">
            <div class="composer-modes mode-segment slim-segment" role="radiogroup" aria-label="提问方式">
              <label title="快速问答：工具调用上限本会话 4 步、全局 6 步，检索轮次较少"><input type="radio" id="fastMode" name="chatAskMode" checked><span>快速问答</span></label>
              <label title="探索模式：工具调用上限本会话 8 步、全局 12 步，适合统计、枚举和跨时段排查"><input type="radio" id="exploreMode" name="chatAskMode"><span>探索模式</span></label>
            </div>
            <div class="mode-segment mode-segment-check slim-segment" role="group" aria-label="思考深度">
              <label title="深度思考：切换推理模型，复杂问题更准但更慢"><input type="checkbox" id="thinkToggle"><span>深度思考</span></label>
            </div>
            <button id="newSessionBtn" class="ghost-btn ghost-btn-slim" title="在当前范围新建一个 AI 会话">＋ 新会话</button>
            <input type="checkbox" id="exploreToggle" class="mode-state" aria-hidden="true" tabindex="-1">
          </div>
          <div class="composer">
            <div class="input-shell">
              <textarea id="input" rows="1" placeholder="输入你想查询的问题…" title="Enter 发送 · Shift+Enter 换行；在消息上右键可加入引用"></textarea>
            </div>
            <div class="composer-actions">
              <button id="sendBtn">发送</button>
            </div>
          </div>
        </footer>
      </div>

      <!-- 右侧：只显示提问与 AI 结果 -->
      <button id="drawerFab" class="drawer-fab" style="display:none" title="显示 AI 问答">✦</button>
      <div id="settingsFull" class="settings-full" style="display:none">
        <div class="sf-nav" id="sfNav"></div>
        <div class="sf-body" id="sfBody"></div>
      </div>
      <aside id="assistantPane" class="assistant-pane" style="display:none">
        <div class="drawer-head assistant-head">
          <div class="assistant-heading"><span class="assistant-mark">✦</span><div><b id="assistantTitle">AI 助手</b><small>统一检索聊天记录，帮你归纳和追问</small></div></div>
          <span id="assistantMeta" class="drawer-scope"></span>
        </div>
        <div id="assistantConv" class="qa-list"></div>
        <footer class="composer-wrap assistant-composer-wrap">
          <div class="scope-bar assistant-scope-bar">
            <span class="scope-caption">范围</span>
            <select id="assistantScopeSelect" class="assistant-scope-select" aria-label="选择回答范围">
              <option value="assistant">全部聊天记录</option>
            </select>
            <label class="scope-toggle" id="assistantScopeWrap" title="勾选后只在这个范围内检索" style="display:none">
              <input type="checkbox" id="assistantScopeToggle" checked><span id="assistantScopeToggleText">仅本会话</span><b id="assistantScopeName"></b>
            </label>
          </div>
          <div class="composer-toolbar">
            <div class="composer-modes mode-segment slim-segment" role="radiogroup" aria-label="AI 助手提问方式">
              <label title="快速问答：工具调用上限本会话 4 步、全局 6 步，检索轮次较少"><input type="radio" id="assistantFastMode" name="assistantAskMode" checked><span>快速问答</span></label>
              <label title="探索模式：工具调用上限本会话 8 步、全局 12 步，适合统计、枚举和跨时段排查"><input type="radio" id="assistantExploreMode" name="assistantAskMode"><span>探索模式</span></label>
            </div>
            <div class="mode-segment mode-segment-check slim-segment" role="group" aria-label="AI 助手思考深度">
              <label title="深度思考：切换推理模型，复杂问题更准但更慢"><input type="checkbox" id="assistantThink"><span>深度思考</span></label>
            </div>
            <button id="assistantNew" class="ghost-btn ghost-btn-slim" title="在当前范围新建一个 AI 会话">＋ 新会话</button>
          </div>
          <div class="composer assistant-composer">
            <div class="input-shell">
              <textarea id="assistantInput" rows="1" placeholder="输入想了解的问题…" title="Enter 发送 · Shift+Enter 换行"></textarea>
            </div>
            <div class="composer-actions">
              <button id="assistantSend">发送</button>
            </div>
          </div>
        </footer>
      </aside>
      <aside id="aiSessionsPanel" class="ai-sessions-panel" style="display:none">
        <div class="drawer-head">
          <span>✦ AI 会话</span>
          <span class="drawer-scope">点一条在中间继续</span>
        </div>
        <div id="aiTreeInPanel" class="ai-tree"></div>
      </aside>
      <aside id="drawer" class="drawer">
        <div class="drawer-head">
          <span>✦ AI 问答结果</span>
          <span id="drawerScope" class="drawer-scope"></span>
        </div>
        <div id="qaList" class="qa-list"></div>
      </aside>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="app.js?v=101"></script>
<script src="stream_qa.js?v=19"></script>
</body>
</html>
